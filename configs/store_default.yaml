store_id: "store_001"
name: "Retail Flagship Downtown"
version: "1.0.0"

video:
  source: "data/sample_queue_checkout.mp4"
  target_fps: 15
  frame_skip: 1
  input_resolution: [1280, 720]
  inference_resolution: [640, 640]

lines:
  - id: "entrance_main"
    name: "Main Entrance Crossing"
    start_point: [450, 620]
    end_point: [830, 620]
    entry_direction: "down" # "up", "down", "left", "right"

zones:
  - id: "zone_promo_endcap"
    name: "Promotional Endcap"
    polygon:
      - [100, 200]
      - [350, 200]
      - [350, 500]
      - [100, 500]
    min_dwell_seconds: 3.0

  - id: "zone_electronics_aisle"
    name: "Electronics Aisle"
    polygon:
      - [850, 180]
      - [1150, 180]
      - [1150, 520]
      - [850, 520]
    min_dwell_seconds: 5.0

queues:
  - counter_id: "counter_1"
    name: "Billing Counter 1 (Express)"
    polygon:
      - [480, 250]
      - [640, 250]
      - [640, 600]
      - [480, 600]
    service_point: [560, 230]
    target_wait_seconds: 120
    max_recommended_queue: 3

  - counter_id: "counter_2"
    name: "Billing Counter 2 (Standard)"
    polygon:
      - [660, 250]
      - [820, 250]
      - [820, 600]
      - [660, 600]
    service_point: [740, 230]
    target_wait_seconds: 180
    max_recommended_queue: 4

shelves:
  - shelf_id: "shelf_beverages"
    name: "Cold Beverages Unit"
    category: "Beverages"
    roi: [120, 150, 240, 300] # [x, y, width, height]
    expected_stock: 12
    low_stock_ratio: 0.35
    empty_stock_ratio: 0.10

  - shelf_id: "shelf_snacks"
    name: "Snacks & Confectionery"
    category: "Snacks"
    roi: [880, 150, 240, 300]
    expected_stock: 15
    low_stock_ratio: 0.30
    empty_stock_ratio: 0.10

storage:
  db_path: "data/edge_store.db"
  sync_batch_size: 50
  sync_interval_seconds: 30
  retention_days: 90
